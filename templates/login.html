<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DeadCodeX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020C1B; color: #d6e3ff; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-screen flex items-center justify-center bg-[#020C1B]">
<div class="w-full max-w-md p-8 bg-[#0A192F] border border-white/10 rounded-xl shadow-2xl">
    <h2 class="text-3xl font-bold text-center mb-6 text-white">Welcome Back</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div role="alert" class="p-3 mb-4 {% if category == 'success' %}bg-emerald-500/20 text-emerald-400{% else %}bg-red-500/20 text-red-400{% endif %} rounded text-sm">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if request.args.get('next') %}<input type="hidden" name="next" value="{{ request.args.get('next') }}">{% endif %}
        <div>
            <label class="block text-sm text-slate-400 mb-1">Username</label>
            <input type="text" name="username" required class="w-full bg-[#020C1B] border border-white/10 rounded p-3 text-white focus:border-emerald-500 outline-none">
        </div>
        <div>
            <label class="block text-sm text-slate-400 mb-1">Password</label>
            <input type="password" name="password" required class="w-full bg-[#020C1B] border border-white/10 rounded p-3 text-white focus:border-emerald-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-3 rounded transition">LOGIN</button>
    </form>

    <p class="mt-6 text-center text-slate-500 text-sm">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-emerald-400 hover:underline">Register here</a>
    </p>
</div>
</body>
</html>
